<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <!-- Cloud Glow Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Filter for neon glows -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes orb-float-1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, -30px) scale(1.15); }
    }
    @keyframes orb-float-2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 40px) scale(1.1); }
    }
    @keyframes pulse-node {
      0%, 100% { r: 4px; opacity: 0.6; }
      50% { r: 6.5px; opacity: 1; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orb-1 { animation: orb-float-1 14s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: orb-float-2 18s ease-in-out infinite; transform-origin: center; }
    .pulse-dot { animation: pulse-node 3s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 6 6; animation: dash-flow 2.5s linear infinite; }
    .badge-float-1 { animation: float-badge 6s ease-in-out infinite; }
    .badge-float-2 { animation: float-badge 7s ease-in-out infinite 1s; }
    .badge-float-3 { animation: float-badge 8s ease-in-out infinite 2s; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Animated Ambient Glowing Orbs in Background -->
  <g opacity="0.4">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#glow-blur)"/>
    <circle class="orb-2" cx="980" cy="300" r="160" fill="#a855f7" filter="url(#glow-blur)"/>
    <circle class="orb-1" cx="1020" cy="100" r="120" fill="#06b6d4" filter="url(#glow-blur)"/>
    <circle class="orb-2" cx="180" cy="340" r="130" fill="#6366f1" filter="url(#glow-blur)"/>
  </g>

  <!-- Dynamic Infrastructure Circuit / Topology Lines (Behind Content) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 60 80 Q 240 160 400 90 T 800 130 T 1140 70" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-line" d="M 80 360 Q 300 280 520 330 T 940 310 T 1120 350" fill="none" stroke="#a855f7" stroke-width="2"/>
    
    <!-- Cloud Mock Nodes -->
    <circle class="pulse-dot" cx="240" cy="160" r="5" fill="#38bdf8"/>
    <circle class="pulse-dot" cx="800" cy="130" r="5" fill="#c084fc"/>
    <circle class="pulse-dot" cx="300" cy="280" r="5" fill="#38bdf8"/>
    <circle class="pulse-dot" cx="940" cy="310" r="5" fill="#818cf8"/>
  </g>

  <!-- Foreground Main Content (Clear, Crisp, High-Contrast Typography) -->
  <g id="foreground-content">
    
    <!-- Header Tag / Category Pill -->
    <g transform="translate(600, 72)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="-160" cy="0" r="5" fill="#10b981"/>
      <text x="0" y="5" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600" letter-spacing="1.5">⚡ CURATED ECOSYSTEM &amp; TESTING RUNTIMES</text>
    </g>

    <!-- Main Repository Title -->
    <text x="600" y="152" text-anchor="middle" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Cloud Infrastructure &amp;
    </text>
    <text x="600" y="206" text-anchor="middle" font-size="44" font-weight="800" fill="url(#primary-glow)" letter-spacing="-0.5">
      Local Cloud Mocking
    </text>

    <!-- Descriptive Subtitle -->
    <text x="600" y="248" text-anchor="middle" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Offline AWS, Azure, GCP &amp; Cloudflare Emulators • Ephemeral K8s Sandboxes • Containerized CI/CD Testing
    </text>

    <!-- Feature Attribute Cards / Interactive Pills in Lower Foreground -->
    <g transform="translate(600, 316)">
      <!-- Pill 1: Local Cloud Mocking -->
      <g class="badge-float-1" transform="translate(-390, 0)">
        <rect x="0" y="0" width="230" height="46" rx="10" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="24" y="28" font-size="18">☁️</text>
        <text x="54" y="23" fill="#f8fafc" font-size="13" font-weight="600">Local Cloud APIs</text>
        <text x="54" y="38" fill="#64748b" font-size="10.5">AWS • Azure • GCP • Workers</text>
      </g>

      <!-- Pill 2: Virtual K8s & Sandboxes -->
      <g class="badge-float-2" transform="translate(-125, 0)">
        <rect x="0" y="0" width="250" height="46" rx="10" fill="url(#pill-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="24" y="28" font-size="18">☸️</text>
        <text x="54" y="23" fill="#f8fafc" font-size="13" font-weight="600">Virtual Kubernetes</text>
        <text x="54" y="38" fill="#64748b" font-size="10.5">vCluster • Minikube • kind • k3d</text>
      </g>

      <!-- Pill 3: Ephemeral CI/CD Testing -->
      <g class="badge-float-3" transform="translate(160, 0)">
        <rect x="0" y="0" width="230" height="46" rx="10" fill="url(#pill-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="24" y="28" font-size="18">🧪</text>
        <text x="54" y="23" fill="#f8fafc" font-size="13" font-weight="600">Ephemeral Testing</text>
        <text x="54" y="38" fill="#64748b" font-size="10.5">Testcontainers • Zero Cloud Bill</text>
      </g>
    </g>

    <!-- Bottom Accent Border -->
    <rect x="0" y="416" width="1200" height="4" fill="url(#primary-glow)"/>
  </g>
</svg>
